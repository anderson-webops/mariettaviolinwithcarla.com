name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 26.13.0
  NPM_VERSION: 12.2.2
  NPM_CONFIG_CACHE: ${{ github.workspace }}/.ai-work/runs/ci/npm-cache
  NUXT_TELEMETRY_DISABLED: "1"
  PUPPETEER_SKIP_DOWNLOAD: "true"

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Restore locked download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.NPM_CONFIG_CACHE }}/_cacache
          key: locked-npm-${{ runner.os }}-${{ runner.arch }}-26.13.0-${{ hashFiles('package-lock.json', 'build-toolchain/package-lock.json', 'vendor/unimport/build/package-lock.json', 'vendor/unimport/runtime/package-lock.json') }}

      - name: Prepare independently locked build tools
        run: |
          bin="$(node scripts/build-toolchain.mjs --print-bin)"
          printf '%s\n' "$bin" >> "$GITHUB_PATH"
          npm_execpath="$bin/../node_modules/npm/bin/npm-cli.js" "$bin/node" scripts/check-build-toolchain.mjs
          npm_execpath="$bin/../node_modules/npm/bin/npm-cli.js" "$bin/node" scripts/check-toolchain-package.mjs

      - name: Verify and rebuild the signed-source auto-import provider
        run: bash scripts/prepare-unimport-source.sh

      - name: Install locked dependencies
        run: npm ci --include=optional --strict-allow-scripts

      - name: Verify toolchain
        run: |
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(npm --version)" = "${NPM_VERSION}"

      - name: Validate editable site content
        run: npm run validate:content

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Full dependency audit
        run: npm run audit

      - name: Production dependency audit
        run: npm run audit:production

      - name: Verify registry signatures
        run: npm run audit:signatures

      - name: Verify dependency tree
        run: npm run verify:dependency-graph

      - name: Verify native lockfile coverage
        run: npm run verify:native-lock

      - name: Simulate Linux ARM64 installs
        run: npm run verify:platform-install

      - name: Build and verify the static deployment
        run: npm run build

      - name: Validate production-only dependency surface
        run: |
          npm ci --omit=dev --include=optional --ignore-scripts
          npm run audit:production
          npm run verify:static

  end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Restore locked download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.NPM_CONFIG_CACHE }}/_cacache
          key: locked-npm-${{ runner.os }}-${{ runner.arch }}-26.13.0-${{ hashFiles('package-lock.json', 'build-toolchain/package-lock.json', 'vendor/unimport/build/package-lock.json', 'vendor/unimport/runtime/package-lock.json') }}

      - name: Prepare independently locked build tools
        run: |
          bin="$(node scripts/build-toolchain.mjs --print-bin)"
          printf '%s\n' "$bin" >> "$GITHUB_PATH"
          npm_execpath="$bin/../node_modules/npm/bin/npm-cli.js" "$bin/node" scripts/check-build-toolchain.mjs
          npm_execpath="$bin/../node_modules/npm/bin/npm-cli.js" "$bin/node" scripts/check-toolchain-package.mjs

      - name: Verify and rebuild the signed-source auto-import provider
        run: bash scripts/prepare-unimport-source.sh

      - name: Install locked dependencies
        run: npm ci --include=optional --strict-allow-scripts
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"

      - name: Build
        run: npm run build

      - name: Browser tests
        run: npm run test:e2e

  accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Restore locked download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.NPM_CONFIG_CACHE }}/_cacache
          key: locked-npm-${{ runner.os }}-${{ runner.arch }}-26.13.0-${{ hashFiles('package-lock.json', 'build-toolchain/package-lock.json', 'vendor/unimport/build/package-lock.json', 'vendor/unimport/runtime/package-lock.json') }}

      - name: Prepare independently locked build tools
        run: |
          bin="$(node scripts/build-toolchain.mjs --print-bin)"
          printf '%s\n' "$bin" >> "$GITHUB_PATH"
          npm_execpath="$bin/../node_modules/npm/bin/npm-cli.js" "$bin/node" scripts/check-build-toolchain.mjs
          npm_execpath="$bin/../node_modules/npm/bin/npm-cli.js" "$bin/node" scripts/check-toolchain-package.mjs

      - name: Verify and rebuild the signed-source auto-import provider
        run: bash scripts/prepare-unimport-source.sh

      - name: Install locked dependencies
        run: npm ci --include=optional --strict-allow-scripts

      - name: Accessibility smoke
        run: npm run a11y

  native-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Restore locked download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.NPM_CONFIG_CACHE }}/_cacache
          key: locked-npm-${{ runner.os }}-${{ runner.arch }}-26.13.0-${{ hashFiles('package-lock.json', 'build-toolchain/package-lock.json', 'vendor/unimport/build/package-lock.json', 'vendor/unimport/runtime/package-lock.json') }}

      - name: Prepare independently locked build tools
        run: |
          bin="$(node scripts/build-toolchain.mjs --print-bin)"
          printf '%s\n' "$bin" >> "$GITHUB_PATH"
          npm_execpath="$bin/../node_modules/npm/bin/npm-cli.js" "$bin/node" scripts/check-build-toolchain.mjs
          npm_execpath="$bin/../node_modules/npm/bin/npm-cli.js" "$bin/node" scripts/check-toolchain-package.mjs

      - name: Verify and rebuild the signed-source auto-import provider
        run: bash scripts/prepare-unimport-source.sh

      - name: Install ARM64 dependencies
        run: npm ci --include=optional --strict-allow-scripts

      - name: Verify native lockfile coverage
        run: npm run verify:native-lock

      - name: Build on ARM64
        run: npm run build
