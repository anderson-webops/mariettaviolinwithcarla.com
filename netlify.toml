[build]
publish = "front-end/dist"
command = "npm run build"

[build.environment]
NODE_VERSION = "24.18.1"
NPM_VERSION = "12.0.2"
NPM_FLAGS = "--include=optional --strict-allow-scripts"
NUXT_TELEMETRY_DISABLED = "1"
PUPPETEER_SKIP_DOWNLOAD = "true"
CYPRESS_INSTALL_BINARY = "0"

[[redirects]]
from = "/healthz"
to = "/healthz.json"
status = 200
force = true

[[redirects]]
from = "/readyz"
to = "/readyz.json"
status = 200
force = true

[[redirects]]
from = "/api"
to = "/404.html"
status = 404
force = true

[[redirects]]
from = "/api/*"
to = "/404.html"
status = 404
force = true

[[redirects]]
from = "/accounts"
to = "/404.html"
status = 404
force = true

[[redirects]]
from = "/accounts/*"
to = "/404.html"
status = 404
force = true

[[redirects]]
from = "/admin"
to = "/404.html"
status = 404
force = true

[[redirects]]
from = "/admin/*"
to = "/404.html"
status = 404
force = true

[[redirects]]
from = "/_dbinfo"
to = "/404.html"
status = 404
force = true

[[headers]]
for = "/*"

[headers.values]
Cache-Control = "no-cache"
Content-Security-Policy = "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action https://usebasin.com; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://analytics.mariettaviolinwithcarla.com https://analytics.jacobdanderson.net; connect-src 'self' https://analytics.mariettaviolinwithcarla.com https://analytics.jacobdanderson.net; frame-src https://usebasin.com; media-src 'none'; worker-src 'none'; manifest-src 'self'; upgrade-insecure-requests"
Cross-Origin-Opener-Policy = "same-origin"
Cross-Origin-Resource-Policy = "same-origin"
Permissions-Policy = "accelerometer=(), autoplay=(), camera=(), clipboard-read=(), display-capture=(), encrypted-media=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=(), xr-spatial-tracking=()"
Referrer-Policy = "strict-origin-when-cross-origin"
Strict-Transport-Security = "max-age=31536000; includeSubDomains"
X-Content-Type-Options = "nosniff"
X-Frame-Options = "DENY"

[[headers]]
for = "/_nuxt/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/healthz"

[headers.values]
Cache-Control = "no-store"
Content-Type = "application/json; charset=UTF-8"
X-Robots-Tag = "noindex, nofollow"

[[headers]]
for = "/readyz"

[headers.values]
Cache-Control = "no-store"
Content-Type = "application/json; charset=UTF-8"
X-Robots-Tag = "noindex, nofollow"

[[headers]]
for = "/deployment.json"

[headers.values]
Cache-Control = "no-store"
X-Robots-Tag = "noindex, nofollow"

[[headers]]
for = "/release.json"

[headers.values]
Cache-Control = "no-store"
X-Robots-Tag = "noindex, nofollow"
