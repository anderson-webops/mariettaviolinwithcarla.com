[build]
publish = "front-end/dist"
command = "npm run -w front-end build"

[build.environment]
NODE_VERSION = "24.18.0"

[functions]
directory = "netlify/functions"
node_bundler = "esbuild"

[[redirects]]
from = "/healthz"
to = "/.netlify/functions/healthz"
status = 200

[[redirects]]
from = "/readyz"
to = "/.netlify/functions/readyz"
status = 200

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
