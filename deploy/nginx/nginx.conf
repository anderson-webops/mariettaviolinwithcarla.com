worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
	worker_connections 1024;
}

http {
	include /etc/nginx/mime.types;
	default_type application/octet-stream;
	access_log /dev/stdout;
	sendfile on;
	keepalive_timeout 30;
	server_tokens off;
	client_max_body_size 1k;

	client_body_temp_path /tmp/client_temp;
	proxy_temp_path /tmp/proxy_temp;
	fastcgi_temp_path /tmp/fastcgi_temp;
	uwsgi_temp_path /tmp/uwsgi_temp;
	scgi_temp_path /tmp/scgi_temp;

	map $uri $response_cache_control {
		default "no-cache";
		~^/_nuxt/ "public, max-age=31536000, immutable";
		~^/(?:healthz|readyz|deployment\.json|release\.json)$ "no-store";
	}

	server {
		listen 8080;
		server_name _;
		root /usr/share/nginx/html;
		index index.html;

		if ($request_method !~ ^(?:GET|HEAD)$) {
			return 405;
		}

		add_header Cache-Control $response_cache_control always;
		add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action https://usebasin.com; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://analytics.mariettaviolinwithcarla.com https://analytics.jacobdanderson.net; connect-src 'self' https://analytics.mariettaviolinwithcarla.com https://analytics.jacobdanderson.net; frame-src https://usebasin.com; media-src 'none'; worker-src 'none'; manifest-src 'self'; upgrade-insecure-requests" always;
		add_header Cross-Origin-Opener-Policy "same-origin" always;
		add_header Cross-Origin-Resource-Policy "same-origin" always;
		add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), clipboard-read=(), display-capture=(), encrypted-media=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=(), xr-spatial-tracking=()" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header X-Frame-Options "DENY" always;

		error_page 404 /404.html;

		location = /404.html {
			internal;
		}

		location = /healthz {
			default_type application/json;
			try_files /healthz.json =404;
		}

		location = /readyz {
			default_type application/json;
			try_files /readyz.json =404;
		}

		location ~ ^/(?:api(?:/|$)|accounts(?:/|$)|admin(?:/|$)|_dbinfo$) {
			return 404;
		}

		location ~ /\. {
			return 404;
		}

		location /_nuxt/ {
			try_files $uri =404;
		}

		location / {
			try_files $uri $uri/ $uri/index.html =404;
		}
	}
}
